# Hive metastore
spark.sql.catalogImplementation   hive
spark.hadoop.hive.metastore.uris  thrift://hive-metastore:9083
spark.sql.warehouse.dir           file:///opt/warehouse
# The builtin Hive 2.3 client calls Thrift methods removed in Hive 4, so use a
# client matching the metastore. Jars are resolved from Maven on first use and
# cached in ivy.home (a volume on spark-connect). HiveUtils ignores spark.jars.ivy
# and otherwise falls back to user.home, which is /nonexistent for the spark user.
spark.sql.hive.metastore.version  4.0.1
spark.sql.hive.metastore.jars     maven
spark.driver.extraJavaOptions     -Divy.home=/opt/spark/ivy

# Apache Sedona
spark.sql.extensions              org.apache.sedona.sql.SedonaSqlExtensions
spark.serializer                  org.apache.spark.serializer.KryoSerializer
spark.kryo.registrator            org.apache.sedona.core.serde.SedonaKryoRegistrator
