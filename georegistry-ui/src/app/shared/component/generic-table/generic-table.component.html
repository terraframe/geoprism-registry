<div>
  <ag-grid-angular
    class="generic-table-grid"
    [theme]="theme"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [icons]="icons"
    [rowData]="page.resultSet"
    [loading]="loading"
    [domLayout]="height ? 'normal' : 'autoHeight'"
    [style.height]="height"
    [autoSizeStrategy]="autoSizeStrategy"
    [floatingFiltersHeight]="floatingFiltersHeight"
    [suppressCellFocus]="true"
    [enableCellTextSelection]="true"
    (gridReady)="onGridReady($event)"
    (sortChanged)="onSortChanged()"
  ></ag-grid-angular>

  @if (paginator) {
    <div class="generic-table-paginator">
      <span class="page-report">{{ pageReport }}</span>

      <pagination
        class="pagination-sm mb-0"
        [totalItems]="page.count"
        [itemsPerPage]="page.pageSize"
        [ngModel]="currentPage"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        previousText="&lsaquo;"
        nextText="&rsaquo;"
        firstText="&laquo;"
        lastText="&raquo;"
        (pageChanged)="onPageChanged($event)"
      ></pagination>

      <select
        class="form-select form-select-sm page-size"
        [ngModel]="page.pageSize"
        (ngModelChange)="onPageSizeChange($event)"
        aria-label="Rows per page"
      >
        @for (size of pageSizeOptions; track size) {
          <option [ngValue]="size">{{ size }}</option>
        }
      </select>
    </div>
  }

  <div style="width: 100%; text-align: right">
    @if (config.create) {
      <button (click)="onClick('create', null, null)" style="margin: 10px 0 0" class="btn btn-primary">
        Add new {{ config.label }}
      </button>
    }
  </div>
</div>
