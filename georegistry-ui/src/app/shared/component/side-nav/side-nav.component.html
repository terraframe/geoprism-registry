<!-- HEADER AND NAVBAR -->
<div class="side-nav-root">
  <div class="row nav-row">
    <div class="col-xs-12">
      <a [href]="context + '#/menu'" class="brand">
        <h3>
          <img class="brand-img" [src]="context + 'api/asset/view?oid=logo'" />
          @if (expanded) {
            <localize key="cgr.standard.title"></localize>
          }
        </h3>
      </a>
    </div>
  </div>

  <div class="row nav-row">
    <div class="col-xs-12">
      @for (section of sections; track section.title) {
        <div class="card card-default section">
          <div class="card-body">
            @if (expanded) {
              <h4 class="card-title"><localize [key]="section.title"></localize></h4>
            }
            @for (menu of section.items; track menu.id) {
              @if (shouldShowMenuItem(menu.id)) {
                <div class="row nav-row">
                  <div class="col-xs-12">
                    <a
                      [routerLink]="menu.link"
                      [ngClass]="{ expanded: expanded }"
                      class="route-item"
                      routerLinkActive="active"
                      [title]="menu.key | localize"
                    >
                      <i class="route-icon" [class]="menu.icon"></i>
                      @if (expanded) {
                        <span class="route-text">
                          <localize [key]="menu.key"></localize>
                        </span>
                      }
                    </a>
                  </div>
                </div>
              }
            }
          </div>
        </div>
      }

      @if (!isPublic) {
        <div class="card card-default section" style="margin-bottom: 20px">
          <div class="card-body">
            <hr />
            @if (shouldShowMenuItem('SETTINGS')) {
              <div class="row nav-row">
                <div class="col-xs-12">
                  <a
                    routerLink="/admin/settings"
                    [ngClass]="{ expanded: expanded }"
                    class="route-item"
                    routerLinkActive="active"
                    [title]="'settings.menu' | localize"
                  >
                    <i class="route-icon fa-solid fa-gear"></i>
                    @if (expanded) {
                      <span class="route-text">
                        <localize key="settings.menu"></localize>
                      </span>
                    }
                  </a>
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>

  <!--
    The collapse toggle is the last child of the flex column above, so
    "margin-top: auto" (see side-nav.css) drops it to the bottom of the
    sidebar. It stays an ordinary in-flow Bootstrap row so it lines up with
    the sidebar's real width at any screen size.
    -->
  <div class="row fixed-bottom-row">
    <div class="col-xs-12" [ngClass]="{ expanded: expanded }">
      <a class="user-command-link route-item" (click)="handleToggle()" [ngClass]="{ expanded: expanded }">
        <i class="fa-solid" [ngClass]="{ 'fa-chevron-left': expanded, 'fa-chevron-right': !expanded }"></i>
      </a>
    </div>
  </div>
</div>
