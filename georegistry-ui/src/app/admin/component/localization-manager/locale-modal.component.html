<div>
  <loading-bar></loading-bar>

  <form #form="ngForm" class="modal-form" name="new-locale-form" (ngSubmit)="form.valid && submit()">
    <div class="modal-body">
      @if (locale) {
        <fieldset>
          <div class="heading text-center">
            <h1>
              @if (this.isNew) {
                <localize key="new-locale.title"></localize>
              }
              @if (!this.isNew) {
                <localize key="edit-locale.title"></localize>
              }
            </h1>
          </div>
          @if (locale.language && locale.toString !== 'defaultLocale') {
            <div class="row-holder">
              <div class="label-holder">
                <label>
                  <localize key="new-locale.language"></localize>
                </label>
              </div>
              <div class="holder">
                <select [(ngModel)]="locale.language.code" name="new-locale-language">
                  @for (lang of allLocaleInfo.languages; track lang) {
                    <option [ngValue]="lang.key">{{ lang.label }}</option>
                  }
                </select>
              </div>
            </div>
          }
          @if (locale.country && locale.toString !== 'defaultLocale') {
            <div class="row-holder">
              <div class="label-holder">
                <label>
                  <localize key="new-locale.country"></localize>
                </label>
              </div>
              <div class="holder">
                <select [(ngModel)]="locale.country.code" name="new-locale-country">
                  @for (count of allLocaleInfo.countries; track count) {
                    <option [ngValue]="count.key">{{ count.label }}</option>
                  }
                </select>
              </div>
            </div>
          }
          <!--     <div> -->
          <!--       <label> -->
          <!--         <localize key="new-locale.variant"></localize> -->
          <!--       </label> -->
          <!--       <input type="text" [(ngModel)]="locale.variant" name="new-locale-variant" /> -->
          <!--     </div> -->
          @if (locale.label) {
            <div class="row-holder">
              <div class="label-holder">
                <label>
                  <localize key="settings.localization.locale.displayLabel"></localize>
                </label>
              </div>
              <div class="holder" style="padding-top: 10px">
                @for (localeValue of locale.label.localeValues; track localeValue.locale) {
                  <div class="form-group">
                    <label> <convert-key-label [key]="localeValue.locale"></convert-key-label></label>
                    <input
                      [(ngModel)]="localeValue.value"
                      [name]="'label-' + localeValue.locale"
                      type="input"
                      class="form-control"
                      required
                    />
                  </div>
                }
              </div>
            </div>
          }
          <div class="row-holder">
            <div class="label-holder"></div>
            <div class="holder">
              <div class="button-holder">
                <button type="button" (click)="cancel()" class="btn btn-default" role="button" aria-disabled="false">
                  <span>
                    <localize key="new-locale.cancel"></localize>
                  </span>
                </button>
                <button type="submit" class="btn btn-primary" role="button" aria-disabled="false">
                  <span>
                    <localize key="new-locale.submit"></localize>
                  </span>
                </button>
              </div>
            </div>
          </div>
        </fieldset>
      }
    </div>
  </form>
</div>
