<form #form="ngForm" class="modal-form" (ngSubmit)="submit()">
  <div class="modal-body">
    <div class="heading text-center">
      <h1>
        <localize key="settings.backup.modal.title"></localize>
      </h1>
    </div>

    <div class="backup-toolbar">
      <p>
        <localize key="settings.backup.sections.message"></localize>
      </p>
      <p>
        <a href="javascript:void(0)" (click)="setAll(true)"><localize key="settings.backup.sections.all"></localize></a>
        |
        <a href="javascript:void(0)" (click)="setAll(false)"><localize key="settings.backup.sections.none"></localize></a>
      </p>
    </div>

    <div class="backup-columns">
      @for (column of columns; track $index) {
        <div class="backup-column">
          @for (group of column; track group.key) {
            <div class="backup-group">
              <label class="backup-option backup-group-header">
                <input
                  type="checkbox"
                  [name]="'group_' + group.key"
                  [checked]="isGroupSelected(group.sections)"
                  [indeterminate]="isGroupPartial(group.sections)"
                  (change)="setGroup(group.sections, $any($event.target).checked)"
                />
                <localize [key]="'settings.backup.group.' + group.key"></localize>
              </label>
              @for (section of group.sections; track section) {
                <label class="backup-option">
                  <input type="checkbox" [name]="section" [(ngModel)]="selected[section]" />
                  <localize [key]="'settings.backup.section.' + section"></localize>
                </label>
              }
            </div>
          }
        </div>
      }
    </div>

    @if (selected['USERS']) {
      <p class="backup-users-note">
        <i class="fa fa-exclamation-triangle"></i>
        <localize key="settings.backup.users.message"></localize>
      </p>
    }

    <div class="row">
      <div class="col-md-12">
        <div class="button-holder">
          <button type="button" (click)="cancel()" class="btn btn-default" role="button">
            <localize key="modal.button.cancel"></localize>
          </button>
          <button type="submit" class="btn btn-primary" role="button" [disabled]="getSelected().length === 0">
            <localize key="settings.backup.button"></localize>
          </button>
        </div>
      </div>
    </div>
  </div>
</form>
