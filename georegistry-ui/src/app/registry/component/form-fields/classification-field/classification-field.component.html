<ng-template #customListTemplate let-matches="matches" let-query="query" let-typeaheadTemplateMethods>
  <ul class="list-group">
    @for (match of matches; track match) {
    <li class="list-group-item" [class.active]="typeaheadTemplateMethods.isActive(match)"
      (click)="typeaheadTemplateMethods.selectMatch(match, $event)"
      (mouseenter)="typeaheadTemplateMethods.selectActive(match)">
      {{ match.item.code }}
    </li>
    }
  </ul>
</ng-template>
<div class="input-group">

  <input type="text" class="form-control" autocomplete="off"
    [style]="customStyles" [name]="name" [disabled]="disabled" [(ngModel)]="text"
    [class]="classNames"    
    [typeaheadAsync]="true"
    [typeahead]="typeahead"
    (change)="onTextChange()"
    (typeaheadOnSelect)="typeaheadOnSelect($event)" (typeaheadLoading)="loading = $event"
    [ngClass]="{'inline-loading':loading}" [typeaheadOptionsLimit]="7"
    [optionsListTemplate]="customListTemplate" [typeaheadMinLength]="0" [typeaheadWaitMs]="300"
    [container]="container"
    >

  <span class="input-group-addon clickable addon-alert" (click)="onViewTree()">
    <i class="fa fa-ellipsis-v" aria-hidden="true"></i>
  </span>
</div>
