<page-container>
  @if (isRefreshing) {
    <progress-bar></progress-bar>
  }

  <div class="row">
    <nav class="col-md-3 list-sidebar">
      <div class="sidebar-header">
        <h3><localize key="skg.list.label"></localize></h3>
      </div>

      <hr class="sidebar-divider" />

      <div class="sidebar-section-content">
        <ul class="list-group">
          <div style="text-align: center; padding: 10px 0">
            <button
              (click)="onCreate()"
              type="button"
              class="btn btn-primary"
              style="margin-bottom: 20px; min-width: 45%"
            >
              <localize key="hierarchy.management.button.create"></localize>
            </button>
          </div>

          @for (type of publishes; track type.uid) {
            <li
              class="list-group-item type-li-item"
              [id]="type.uid"
              [ngClass]="{ 'primary active': current != null && current.uid === type.uid }"
              [routerLink]="'/registry/publish'"
              [queryParams]="{ uid: type.uid }"
            >
              {{ type.label }}
              <div class="btn-group float-end" dropdown [dropup]="true" container="body">
                <a
                  class="float-end"
                  dropdownToggle
                  (click)="$event.stopPropagation()"
                  aria-controls="basic-link-dropdown"
                >
                  <i class="fa fa-ellipsis-vertical clickable"></i>
                </a>
                <ul *dropdownMenu class="dropdown-menu" role="menu" aria-labelledby="button-animated">
                  <li role="menuitem">
                    <a class="dropdown-item" (click)="onDelete(type)">
                      <localize key="button.delete.helptext"></localize>
                    </a>
                  </li>
                </ul>
              </div>
            </li>
          }
        </ul>
      </div>
    </nav>
    <div class="col-md-9 list-type-content">
      <div id="overflow-div">
        @if (message != null) {
          <div #errorAlert class="alert alert-danger" role="alert">
            {{ message }}
          </div>
        }

        @if (current != null) {
          <publish-events
            [type]="current"
            [types]="types"
            [hierarchies]="hierarchies"
            [dagTypes]="dagTypes"
            [undirectedTypes]="undirectedTypes"
            [businessTypes]="businessTypes"
            [edgeTypes]="edgeTypes"
            [conceptClasses]="conceptClasses"
            [conceptEdgeTypes]="conceptEdgeTypes"
            (error)="error($event)"
          >
          </publish-events>
        }
      </div>
    </div>
  </div>
</page-container>
