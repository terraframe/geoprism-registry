<page-container>
  @if (message != null) {
    <div class="alert alert-danger" role="alert">{{ message }}</div>
  }

  <div class="row">
    <nav class="col-md-3 list-sidebar">
      <div class="sidebar-header">
        <h2><localize key="header.lpg"></localize></h2>
      </div>

      <hr class="sidebar-divider" />

      <div class="sidebar-section-content">
        <ul class="list-group">
          <div style="text-align: center; padding: 10px 0">
            <button
              (click)="onCreate()"
              type="button"
              class="btn btn-primary"
              style="margin-bottom: 20px; min-width: 45%"
            >
              <localize key="hierarchy.management.button.create"></localize>
            </button>
          </div>

          @for (type of types; track type.oid) {
            <li
              class="list-group-item type-li-item"
              [id]="type.oid"
              [routerLink]="'/registry/labeled-property-graph-type'"
              [queryParams]="{ oid: type.oid }"
              routerLinkActive="primary active"
            >
              {{ type.label }}
              <div class="btn-group float-end" dropdown [dropup]="true" container="body">
                <a
                  class="float-end"
                  dropdownToggle
                  (click)="$event.stopPropagation()"
                  aria-controls="basic-link-dropdown"
                >
                  <i class="fa fa-ellipsis-vertical clickable"></i>
                </a>
                <ul *dropdownMenu class="dropdown-menu" role="menu" aria-labelledby="button-animated">
                  <li role="menuitem">
                    <a class="dropdown-item" (click)="onDelete(type)">
                      <localize key="button.delete.helptext"></localize>
                    </a>
                  </li>
                </ul>
              </div>
            </li>
          }
        </ul>
      </div>
    </nav>
    <div class="col-md-9 list-type-content">
      <div id="overflow-div">
        @if (current != null) {
          <labeled-property-graph-type [type]="current" (error)="error($event)"></labeled-property-graph-type>
        }
      </div>
    </div>
  </div>
</page-container>
