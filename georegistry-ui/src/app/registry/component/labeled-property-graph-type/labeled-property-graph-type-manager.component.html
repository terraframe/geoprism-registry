<page-container>
  @if (message != null) {
    <div class="alert alert-danger" role="alert">{{ message }}</div>
  }

  <div class="row">
    <nav class="col-md-3 list-sidebar">
      <div class="row">
        <div class="col-md-12">
          <h2><localize key="header.lpg"></localize></h2>
        </div>
      </div>
      <div class="sidebar-section-content">
        <ul class="list-group">
          <li class="list-group-item got-li-item">
            <button type="submit" (click)="onCreate()" class="btn btn-primary" role="button">
              <localize key="hierarchy.management.button.create"></localize>
            </button>
          </li>
          <hr />
          @for (type of types; track type.oid) {
            <li class="list-group-item got-li-item" [id]="type.oid">
              <a
                [routerLink]="'/registry/labeled-property-graph-type'"
                [queryParams]="{ oid: type.oid }"
                routerLinkActive="active"
              >
                {{ type.label }}
              </a>
              <span style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%)">
                <a
                  class="fa fa-trash ico-remove"
                  (click)="onDelete(type)"
                  [title]="'button.delete.helptext' | localize"
                ></a>
              </span>
            </li>
          }
        </ul>
      </div>
    </nav>
    <div class="col-md-9 list-type-content">
      <div id="overflow-div">
        @if (current != null) {
          <labeled-property-graph-type [type]="current" (error)="error($event)"></labeled-property-graph-type>
        }
      </div>
    </div>
  </div>
</page-container>
