<page-container>
  @if (inProgress) {
    <progress-bar></progress-bar>
  }

  <div class="ds-page">

    <div class="ds-header">
      <div>
        <h1 class="ds-title"><localize key="header.rollback.checkpoint"></localize></h1>
        <div class="ds-subtitle"><localize key="rollback.manager.subtitle"></localize></div>
      </div>
    </div>

    <div *ngIf="message != null" class="alert alert-danger" role="alert">
      {{ message }}
    </div>

    <div class="ds-card">
      <div class="ds-row ds-row-head" *ngIf="page.count > 0">
        <div><localize key="rollback.filename"></localize></div>
        <div><localize key="rollback.import.date"></localize></div>
        <div class="ds-actions-head"><localize key="data.property.label.actions"></localize></div>
      </div>

      <div
        class="ds-row"
        *ngFor="
          let checkpoint of page.resultSet
            | paginate
              : {
                  id: 'rollback',
                  itemsPerPage: page.pageSize,
                  currentPage: page.pageNumber,
                  totalItems: page.count,
                };
          let i = index
        "
        [class.ds-row-alt]="i % 2 === 1"
      >
        <div class="ds-file">
          <i class="fa fa-file-text" aria-hidden="true"></i>
          <a [routerLink]="'/registry/job/' + checkpoint.historyId" class="ds-file-link">{{
            checkpoint.filename
          }}</a>
        </div>
        <div>{{ checkpoint.importDate }}</div>
        <div class="ds-actions">
          <button type="button" class="btn btn-danger" (click)="onRollback(checkpoint)">
            <i class="fa fa-undo" style="margin-right: 6px;" aria-hidden="true"></i>
            <localize key="modal.button.rollback"></localize>
          </button>
        </div>
      </div>

      <div class="ds-empty-state" *ngIf="page.count === 0">
        <localize key="rollback.no.data"></localize>
      </div>
    </div>

    <pagination-controls
      *ngIf="page.count > 0"
      id="rollback"
      (pageChange)="onPageChange($event)"
      class="ds-pagination"
    ></pagination-controls>

  </div>
</page-container>
