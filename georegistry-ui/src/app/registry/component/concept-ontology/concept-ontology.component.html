<page-container>
    <concept-class-page [hidden]="section !== 'concept-class'" [organizations]="organizations"
        [types]="conceptClasses" (typesChange)="setConceptClasss($event)" (onError)="error($event)">
        <ontology-section-nav sectionNav [items]="sections" [(active)]="section"></ontology-section-nav>
    </concept-class-page>

    <concept-edge-type-page [hidden]="section !== 'concept-edge-type'" [organizations]="organizations"
        [conceptClasses]="conceptClasses" [types]="conceptEdgeTypes" (typesChange)="setConceptEdgeTypes($event)"
        (onError)="error($event)">
        <ontology-section-nav sectionNav [items]="sections" [(active)]="section"></ontology-section-nav>
    </concept-edge-type-page>

    <concept-set-page [hidden]="section !== 'concept-set'" (onError)="error($event)" [conceptClasses]="conceptClasses"
        [conceptEdgeTypes]="conceptEdgeTypes">
        <ontology-section-nav sectionNav [items]="sections" [(active)]="section"></ontology-section-nav>
    </concept-set-page>

</page-container>
