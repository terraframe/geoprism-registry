<page-container>
    <div class="row">
        <div class="col-md-12 order-md-1">
            <tabset [justified]="true">
                <tab [heading]="'nav.concept.class.label' | localize">
                    <concept-class-page [organizations]="organizations" [types]="conceptClasses"
                        (typesChange)="setConceptClasss($event)" (onError)="error($event)">
                    </concept-class-page>
                </tab>

                <!-- LOCALIZE -->
                <tab heading="Concept Edges">
                    <concept-edge-type-page [organizations]="organizations" [conceptClasses]="conceptClasses"
                        [types]="conceptEdgeTypes" (typesChange)="setConceptEdgeTypes($event)"
                        (onError)="error($event)">
                    </concept-edge-type-page>

                </tab>
                <!-- LOCALIZE -->
                <tab heading="Concept Sets">
                    <concept-set-page (onError)="error($event)" [conceptClasses]="conceptClasses"
                        [conceptEdgeTypes]="conceptEdgeTypes">
                    </concept-set-page>

                </tab>

            </tabset>
        </div>
    </div>

</page-container>
