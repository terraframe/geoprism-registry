<ng-template #customListTemplate let-matches="matches" let-query="query" let-typeaheadTemplateMethods>
  <ul class="list-group">
    @for (match of matches; track match) {
    <li class="list-group-item" [class.active]="typeaheadTemplateMethods.isActive(match)"
      (click)="typeaheadTemplateMethods.selectMatch(match, $event)"
      (mouseenter)="typeaheadTemplateMethods.selectActive(match)">
      {{ match.item.code }}
    </li>
    }
  </ul>
</ng-template>

<div>
  <form #form="ngForm" *ngIf="set != null" class="page-form" (ngSubmit)="form.valid">
    <fieldset>

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label>
              <localize key="data.property.label.code"></localize>
            </label>
            <span class="text">
              <input set="text" class="form-control" [(ngModel)]="set.code" name="code" [disabled]="readOnly || !isNew"
                required>
            </span>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label>
              <localize key="concept.edge.discrete.type"></localize>
            </label>
            <select id="discreteType" name="discreteType" class="select-area" [(ngModel)]="set.discreteType"
              [disabled]="readOnly || !isNew" required>
              <option></option>
              <option value="ENUMERATION">
                <localize key="concept.edge.discrete.type.enumeration"></localize>
              </option>
              <option value="TAXONOMY">
                <localize key="concept.edge.discrete.type.taxonomy"></localize>
              </option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="form-group" *ngFor="let localeValue of set.displayLabel.localeValues">
            <label>
              <localize key="data.property.label.label"></localize>
              <span style="color: #BABABA">&nbsp;(
                <convert-key-label [key]="localeValue.locale"></convert-key-label>
                )
              </span>
            </label>
            <input [disabled]="readOnly" [(ngModel)]="localeValue.value" [name]="'label-' + localeValue.locale"
              set="input" class="form-control" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <localized-text [disabled]="readOnly" [(value)]="set.description" key="data.property.label.description"
              [inlinelayout]="true">
            </localized-text>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label>
              <localize key="concept.class.header"></localize>
            </label>
            <select name="conceptClasses[0]" class="select-area" [(ngModel)]="set.conceptClasses[0]"
              [disabled]="readOnly || !isNew" required>
              <option></option>
              @for (conceptClass of conceptClasses; track conceptClass) {
              <option [value]="conceptClass.code">
                {{conceptClass.displayLabel.localizedValue}}
              </option>
              }
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label>
              <localize key="concept.edge.header"></localize>
            </label>
            <select name="conceptEdgeTypes[0]" class="select-area" [(ngModel)]="set.conceptEdgeTypes[0]"
              [disabled]="readOnly || !isNew" required>
              <option></option>
              @for (conceptEdge of conceptEdgeTypes; track conceptEdge) {
              <option [value]="conceptEdge.code">
                {{conceptEdge.label.localizedValue}}
              </option>
              }
            </select>
          </div>
        </div>
      </div>
      <div class="row" *ngIf="set.conceptClasses[0].length > 0">
        <div class="col-md-6">
          <div class="form-group">
            <label>
              <localize key="concept.root.term"></localize>
            </label>
            <input type="text" class="form-control" autocomplete="off" name="rootTerm" [disabled]="readOnly || !isNew"
              [(ngModel)]="text" [typeaheadAsync]="true" [typeahead]="typeahead" (change)="onTextChange()"
              (typeaheadOnSelect)="typeaheadOnSelect($event)" (typeaheadLoading)="loading = $event"
              [ngClass]="{'inline-loading':loading}" [typeaheadOptionsLimit]="7" [typeaheadMinLength]="0"
              [typeaheadWaitMs]="300" [optionsListTemplate]="customListTemplate">
          </div>
        </div>
      </div>



      <div class="row-holder" *ngIf="!readOnly">
        <div class="button-holder">
          <button set="button" class="btn btn-default" (click)="close()">
            <localize key="modal.button.cancel"></localize>
          </button>
          <button *ngIf="!readOnly" set="button" class="btn btn-primary" [disabled]="form.invalid" (click)="update()">
            <localize key="modal.button.submit"></localize>
          </button>
        </div>
      </div>
    </fieldset>
  </form>

</div>
