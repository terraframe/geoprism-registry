<div>

  <div *ngIf="message != null" class="alert alert-danger" role="alert">{{message}}</div>

  <form #form="ngForm" *ngIf="source" class="modal-form" (ngSubmit)="form.valid">
    <div class="heading text-center">
      <h1>
        <span *ngIf="readOnly">View Source</span>
        <span *ngIf="!readOnly">{{source.oid == null ? 'Create Source' : 'Edit Source'}}</span>
      </h1>
    </div>
    <fieldset>
      <div class="row-holder">
        <div class="label-holder">
          <label>
            <localize key="data.property.label.code"></localize>
          </label>
        </div>
        <div class="holder">
          <span class="text">
            <input type="text" [(ngModel)]="source.code" name="code" [disabled]="readOnly" required>
          </span>
        </div>
      </div>

      <localized-input [disabled]="readOnly" [(value)]="source.label" key="data.property.label.label">
      </localized-input>

      <localized-input [disabled]="readOnly" [(value)]="source.description" key="data.property.label.description">
      </localized-input>

      <div class="row-holder">
        <div class="label-holder">
          <label>
            <!-- LOCALIZE -->
            URI
          </label>
        </div>
        <div class="holder">
          <span class="text">
            <input type="text" [(ngModel)]="source.uri" name="uri" [disabled]="readOnly">
          </span>
        </div>
      </div>

      <div class="row-holder">
        <div class="label-holder">
          <label>
            <!-- LOCALIZE -->
            Governance Level
          </label>
        </div>
        <div class="holder">
          <select id="governanceLevel" name="governanceLevel" class="select-area" [(ngModel)]="source.governanceLevel"
            [disabled]="readOnly">
            <option></option>
            <option value="AUTHORITATIVE">Authoritative</option>
            <option value="OFFICIAL">Official</option>
            <option value="COMMUNITY">Community Curated</option>
            <option value="RESEARCH">Research</option>
            <option value="DERIVED">Derived</option>
            <option value="EXPERIMENTAL">Experimental</option>
            <option value="AD_HOC">Ad Hoc</option>
          </select>
        </div>
      </div>

      <div class="row-holder">
        <div class="label-holder">
          <label>
            <!-- LOCALIZE -->
            Metadata Profile
          </label>
        </div>
        <div class="holder">
          <select id="metadataProfile" name="metadataProfile" class="select-area" [(ngModel)]="source.metadataProfile"
            [disabled]="readOnly">
            <option></option>
            <option value="DCAT">DCAT</option>
            <option value="GEO_DCAT">GeoDCAT</option>
            <option value="ISO19115">ISO19115</option>
            <option value="STAC">STAC</option>
            <option value="SENSOR_ML">SensorML</option>
            <option value="FHIR">FHIR</option>
            <option value="DATA_CITE">Data Cite</option>
            <option value="CUSTOM">Custom</option>
            <option value="AD_HOC">Ad Hoc</option>
            <option value="NONE">None</option>
          </select>
        </div>
      </div>

      <div class="row-holder">
        <div class="label-holder">
          <label>
            <!-- LOCALIZE -->
            Source Authority
          </label>
        </div>
        <div class="holder">
          <select id="authority" name="authority" class="select-area" [(ngModel)]="source.authority"
            [disabled]="readOnly" required>
            <option *ngFor="let authority of authorities" [value]="authority.code">{{authority.label.localizedValue}}
            </option>
          </select>
        </div>
      </div>


      <div class="row-holder">
        <div class="button-holder">
          <button type="button" class="btn btn-default" (click)="close()">
            <localize key="modal.button.cancel"></localize>
          </button>
          <button *ngIf="!readOnly" type="button" class="btn btn-primary" [disabled]="form.invalid" (click)="update()">
            <localize key="modal.button.submit"></localize>
          </button>
        </div>
      </div>
    </fieldset>
  </form>

</div>
