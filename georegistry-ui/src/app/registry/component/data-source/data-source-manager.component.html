<page-container>

    <div class="ds-page">

        <div class="ds-header">
            <div>
                <h1 class="ds-title"><localize key="nav.datasource.label"></localize></h1>
                <div class="ds-subtitle"><localize key="datasource.manager.subtitle"></localize></div>
            </div>
            <button type="button" class="btn btn-primary ds-new-btn" (click)="onCreate()">
                <localize key="datasource.manager.button.new"></localize>
            </button>
        </div>

        <div *ngIf="message != null" class="alert alert-danger" role="alert">{{message}}</div>

        <div class="ds-card">
            <div class="ds-row ds-row-head" *ngIf="sources?.length > 0">
                <div><localize key="datasource.governance.level"></localize></div>
                <div><localize key="data.property.label.label"></localize></div>
                <div><localize key="datasource.authority"></localize></div>
                <div class="ds-actions-head"><localize key="data.property.label.actions"></localize></div>
            </div>

            <div class="ds-row" *ngFor="let source of sources; let i = index;" [class.ds-row-alt]="i % 2 === 1">
                <div>
                    <span *ngIf="getGovernanceLevelLabelKey(source.governanceLevel) as levelKey">{{ levelKey | localize }}</span>
                </div>
                <div class="ds-label">{{source.label.localizedValue}}</div>
                <div>{{ getAuthorityLabel(source.authority) }}</div>
                <div class="ds-actions">
                    <button type="button" class="ds-icon-btn" (click)="onEdit(source, true)" [title]="'modal.button.view' | localize">
                        <i class="fa fa-eye" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="ds-icon-btn" (click)="onEdit(source, false)" [title]="'modal.button.edit' | localize">
                        <i class="fa fa-pencil" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="ds-icon-btn ds-icon-btn-danger" (click)="onDelete(source)" [title]="'modal.button.delete' | localize">
                        <i class="fa fa-trash" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div class="ds-empty-state" *ngIf="sources?.length === 0">
                <localize key="datasource.manager.empty.label"></localize>
            </div>
        </div>

    </div>

</page-container>
