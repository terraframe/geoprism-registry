<form>
  @if (modalState.state === 'MANAGE-GEO-OBJECT-TYPE') {
    <geoobjecttype-input
      [readOnly]="readOnly"
      [geoObjectType]="type"
      [setGeoObjectType]="type"
      (stateChange)="onModalStateChange($event)"
      (geoObjectTypeChange)="onGeoObjectTypeChange($event)"
      (onCancel)="close()"
    ></geoobjecttype-input>
  }

  @if (modalState.state === 'DEFINE-ATTRIBUTE') {
    <define-attribute-modal-content
      [geoObjectType]="type"
      [service]="service"
      (stateChange)="onModalStateChange($event)"
      (geoObjectTypeChange)="onGeoObjectTypeChange($event)"
    ></define-attribute-modal-content>
  }

  @if (modalState.state === 'EDIT-ATTRIBUTE') {
    <edit-attribute-modal-content
      [geoObjectType]="type"
      [attribute]="modalState.attribute"
      [service]="service"
      (stateChange)="onModalStateChange($event)"
      (geoObjectTypeChange)="onGeoObjectTypeChange($event)"
    >
    </edit-attribute-modal-content>
  }
</form>
