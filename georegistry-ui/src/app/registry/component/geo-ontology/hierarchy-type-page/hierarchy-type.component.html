<form>
  <div class="modal-body hierarchy-content">
    <form #form="ngForm" class="modal-form">
      <div class="panel panel-default section-panel">
        <div class="panel-heading">
          <h5 class="panel-title"><localize key="hierarchy.management.section.identity.title"></localize></h5>
          <p class="panel-subtitle"><localize key="hierarchy.management.section.identity.description"></localize></p>
        </div>
        <div class="panel-body">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="codeInput">
                  <localize key="data.property.label.code"></localize>
                </label>
                <input
                  [(ngModel)]="hierarchyType.code"
                  name="code"
                  type="input"
                  class="form-control"
                  id="codeInput"
                  [disabled]="edit || readOnly"
                  required
                />
              </div>
            </div>
            <div class="col-md-6">
              @for (localeValue of hierarchyType.label.localeValues; track localeValue.locale) {
                <div class="form-group">
                  <label for="labelInput">
                    <localize key="data.property.label.label"></localize>
                    <span style="color: #bababa"
                      >&nbsp;(<convert-key-label [key]="localeValue.locale"></convert-key-label>)</span
                    >
                  </label>
                  <input
                    [disabled]="readOnly"
                    [(ngModel)]="localeValue.value"
                    [name]="'label-' + localeValue.locale"
                    type="input"
                    class="form-control"
                    required
                  />
                </div>
              }
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <localized-text
                [(value)]="hierarchyType.description"
                key="data.property.label.description"
                [inlinelayout]="true"
                [disabled]="readOnly"
              ></localized-text>
            </div>
          </div>
        </div>
      </div>

      <div class="panel panel-default section-panel">
        <div class="panel-heading">
          <h5 class="panel-title"><localize key="hierarchy.type.section.status.title"></localize></h5>
          <p class="panel-subtitle"><localize key="hierarchy.type.section.status.description"></localize></p>
        </div>
        <div class="panel-body">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>
                  <localize key="data.property.label.progress"></localize>
                </label>
                <textarea
                  [(ngModel)]="hierarchyType.progress"
                  name="progress"
                  class="form-control"
                  [disabled]="readOnly"
                ></textarea>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>
                  <localize key="data.property.label.acknowledgement"></localize>
                </label>
                <textarea
                  [(ngModel)]="hierarchyType.acknowledgement"
                  name="acknowledgement"
                  class="form-control"
                  [disabled]="readOnly"
                ></textarea>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>
                  <localize key="data.property.label.disclaimer"></localize>
                </label>
                <textarea
                  [(ngModel)]="hierarchyType.disclaimer"
                  name="disclaimer"
                  type="text"
                  class="form-control"
                  [disabled]="readOnly"
                ></textarea>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>
                  <localize key="data.property.label.accessConstraints"></localize>
                </label>
                <textarea
                  [(ngModel)]="hierarchyType.accessConstraints"
                  name="accessConstraints"
                  type="text"
                  class="form-control"
                  [disabled]="readOnly"
                ></textarea>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label>
                  <localize key="data.property.label.useConstraints"></localize>
                </label>
                <textarea
                  [(ngModel)]="hierarchyType.useConstraints"
                  name="useConstraints"
                  type="text"
                  class="form-control"
                  [disabled]="readOnly"
                ></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel panel-default section-panel">
        <div class="panel-heading">
          <h5 class="panel-title"><localize key="hierarchy.management.section.ownership.title"></localize></h5>
          <p class="panel-subtitle"><localize key="hierarchy.management.section.ownership.description"></localize></p>
        </div>
        <div class="panel-body">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="organization">
                  <localize key="attribute.organization.label"></localize>
                </label>
                @if (!edit && organizations.length > 1) {
                  <select
                    [disabled]="edit || readOnly"
                    class="form-control"
                    name="organization"
                    [(ngModel)]="hierarchyType.organizationCode"
                    required
                  >
                    <option></option>
                    @for (org of organizations; track org.code) {
                      <option [value]="org.code">{{ org.label.localizedValue }}</option>
                    }
                  </select>
                }
                @if (!edit && organizations.length == 1) {
                  <span class="text"
                    ><input
                      type="text"
                      class="form-control"
                      [(ngModel)]="organizationLabel"
                      name="organization"
                      disabled
                      required
                  /></span>
                }
                @if (edit) {
                  <span class="text"
                    ><input
                      type="text"
                      [(ngModel)]="organizationLabel"
                      name="organization"
                      class="form-control"
                      disabled
                      required
                  /></span>
                }
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel panel-default section-panel">
        <div class="panel-heading">
          <h5 class="panel-title"><localize key="masterlist.contact"></localize></h5>
        </div>
        <div class="panel-body">
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label>
                  <localize key="data.property.label.contact"></localize>
                </label>
                <input
                  [(ngModel)]="hierarchyType.contact"
                  name="contact"
                  type="text"
                  class="form-control"
                  [disabled]="readOnly"
                />
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label>
                  <localize key="data.property.label.phoneNumber"></localize>
                </label>
                <input
                  [(ngModel)]="hierarchyType.phoneNumber"
                  name="phoneNumber"
                  type="text"
                  class="form-control"
                  [disabled]="readOnly"
                />
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label>
                  <localize key="data.property.label.email"></localize>
                </label>
                <input
                  [(ngModel)]="hierarchyType.email"
                  name="email"
                  type="email"
                  class="form-control"
                  [disabled]="readOnly"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      @if (!readOnly) {
        <div class="row">
          <div class="col-md-12">
            <div class="button-holder">
              <button type="button" class="btn btn-default" (click)="handleClose()" style="padding: 4px 18px">
                <localize key="modal.button.close"></localize>
              </button>
              <!-- <button *ngIf="!readOnly" type="submit" [disabled]="hierarchyType.code.length < 1 || form.invalid" class="btn btn-primary"
              (click)="handleOnSubmit()" style="padding: 4px 18px;">
              <localize key="modal.button.ok"></localize>
            </button> -->
            </div>
          </div>
        </div>
      }
    </form>
  </div>
</form>
