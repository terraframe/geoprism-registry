<div>

  <div class="crumbs" *ngIf="!isNew && type != null">
    <span class="crumb-link"><localize key="skg.business.edge.types"></localize></span><span class="sep">/</span>
    <span class="current">{{type.label.localizedValue}}</span>
  </div>

  <div class="heading" *ngIf="!isNew && type != null">
    <h1>{{type.label.localizedValue}}</h1>
    <div class="sub"><localize key="business.edge.header"></localize></div>
  </div>

  <form #form="ngForm" *ngIf="type != null" class="modal-form" (ngSubmit)="form.valid">
    <fieldset>

      <div class="panel panel-default section-panel">
        <div class="panel-heading">
          <h5 class="panel-title"><localize key="hierarchy.management.section.identity.title"></localize></h5>
          <p class="panel-subtitle"><localize key="hierarchy.management.section.identity.description"></localize></p>
        </div>
        <div class="panel-body">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label for="codeInput">
                  <localize key="data.property.label.code"></localize>
                </label>
                <span class="text">
                  <input type="text" [(ngModel)]="type.code" name="code" [disabled]="readOnly || !isNew" required>
                </span>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group" *ngFor="let localeValue of type.label.localeValues">
                <label for="labelInput">
                  <localize key="data.property.label.label"></localize>
                  <span style="color: #BABABA">&nbsp;(<convert-key-label
                      [key]="localeValue.locale"></convert-key-label>)</span>
                </label>
                <input [disabled]="readOnly" [(ngModel)]="localeValue.value" [name]="'label-' + localeValue.locale"
                  type="input" class="form-control" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <localized-text [disabled]="readOnly" [(value)]="type.description" key="data.property.label.description"
                  [inlinelayout]="true">
                </localized-text>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel panel-default section-panel">
        <div class="panel-heading">
          <h5 class="panel-title"><localize key="hierarchy.management.section.configuration.title"></localize></h5>
          <p class="panel-subtitle"><localize key="hierarchy.management.section.configuration.description"></localize></p>
        </div>
        <div class="panel-body">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="parentType">
                  <localize key="business.type.parent"></localize>
                </label>
                <select id="parentType" name="parentType" class="select-area" [(ngModel)]="type.parentType"
                  [disabled]="readOnly || !isNew" required>
                  <option></option>
                  <option [value]="GEO_OBJECT_OPTION">
                    <localize key="dropdown.select.geoobject.label"></localize>
                  </option>
                  <option *ngFor="let businessType of businessTypes" [value]="businessType.code">
                    {{businessType.displayLabel.localizedValue}}
                  </option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label for="childType">
                  <localize key="business.type.child"></localize>
                </label>
                <select id="childType" name="childType" class="select-area" [(ngModel)]="type.childType"
                  [disabled]="readOnly || !isNew" required>
                  <option></option>
                  <option [value]="GEO_OBJECT_OPTION">
                    <localize key="dropdown.select.geoobject.label"></localize>
                  </option>
                  <option *ngFor="let businessType of businessTypes" [value]="businessType.code">
                    {{businessType.displayLabel.localizedValue}}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row-holder" *ngIf="!readOnly">
        <div class="button-holder">
          <button type="button" class="btn btn-default" (click)="close()">
            <localize key="modal.button.cancel"></localize>
          </button>
          <button *ngIf="!readOnly" type="button" class="btn btn-primary" [disabled]="form.invalid" (click)="apply()">
            <localize key="modal.button.submit"></localize>
          </button>
        </div>
      </div>
    </fieldset>
  </form>

</div>
