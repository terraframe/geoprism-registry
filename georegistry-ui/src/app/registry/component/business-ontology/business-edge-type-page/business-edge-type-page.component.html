<!--   <h2> <localize key="hierarchy.management.title"></localize> </h2> -->
<div class="row">
  <nav class="col-md-2 hierarchy-sidebar">
    <ng-content select="[sectionNav]"></ng-content>

    <hr class="sidebar-divider" />

    <div class="sidebar-section-content">
      @for (typeByOrg of typesByOrg; track typeByOrg.org.code) {
        <ul class="list-group">
          <div>
            <div class="got-org-label-wrapper">
              <label>{{ typeByOrg.org.label.localizedValue }}</label>
            </div>
            @if (typeByOrg.write) {
              <div style="text-align: center; padding: 10px 0">
                <button
                  (click)="onCreate(typeByOrg.org)"
                  type="button"
                  class="btn btn-primary"
                  style="margin-bottom: 20px; min-width: 45%"
                >
                  <localize key="hierarchy.management.button.create"></localize>
                </button>
              </div>
            }
            @for (type of typeByOrg.types; track type.code; let i = $index) {
              <li
                class="list-group-item graph-li-item"
                [id]="type.code"
                [ngClass]="{
                  'primary active': selection != null && selection.type != null && type.code === selection.type.code,
                }"
                (click)="handleTypeView(type)"
              >
                {{ type.label.localizedValue }}
                <div class="btn-group pull-right" dropdown [dropup]="true" container="body">
                  <a
                    class="pull-right"
                    dropdownToggle
                    (click)="$event.stopPropagation()"
                    aria-controls="basic-link-dropdown"
                  >
                    <i class="fa fa-ellipsis-vertical clickable dropdown-toggle"></i>
                  </a>
                  <ul *dropdownMenu class="dropdown-menu" role="menu" aria-labelledby="button-animated">
                    @if (isSRA) {
                      <li role="menuitem">
                        <a class="dropdown-item" (click)="onDelete(type)">
                          <localize key="button.delete.helptext"></localize>
                        </a>
                      </li>
                    }
                    <li role="menuitem">
                      <a class="dropdown-item" (click)="onEdit(type)">
                        <localize [key]="isSRA ? 'button.edit.helptext' : 'button.view.helptext'"> </localize>
                      </a>
                    </li>
                    <li role="menuitem">
                      <a class="dropdown-item" (click)="onImportHistory(type)">
                        <localize key="modal.button.import.history"></localize>
                      </a>
                    </li>
                  </ul>
                </div>
              </li>
            }
          </div>
        </ul>
      }
    </div>
  </nav>

  <div class="col-md-10 hierarchy-content">
    <div id="overflow-div">
      @if (selection != null) {
        <manage-business-edge-type
          [isNew]="selection.isNew"
          [type]="selection.type"
          [businessTypes]="businessTypes"
          [readOnly]="selection.readOnly"
          (typeChange)="handleTypeChange($event)"
          (onCancel)="selection = null"
          (onError)="error($event)"
        >
        </manage-business-edge-type>
      }
    </div>
  </div>
</div>
