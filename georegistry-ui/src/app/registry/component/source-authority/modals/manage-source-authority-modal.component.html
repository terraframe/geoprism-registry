<div>

  <div *ngIf="message != null" class="alert alert-danger" role="alert">{{message}}</div>

  <form #form="ngForm" *ngIf="authority" class="modal-form" (ngSubmit)="form.valid">
    <div class="heading text-center">
      <h1>
        <localize key="source.authority.header"></localize>
      </h1>
    </div>
    <fieldset>
      <div class="row-holder">
        <div class="label-holder">
          <label>
            <localize key="data.property.label.code"></localize>
          </label>
        </div>
        <div class="holder">
          <span class="text">
            <input type="text" [(ngModel)]="authority.code" name="code" [disabled]="readOnly" required>
          </span>
        </div>
      </div>

      <localized-input [disabled]="readOnly" [(value)]="authority.label" key="data.property.label.label">
      </localized-input>

      <localized-input [disabled]="readOnly" [(value)]="authority.description" key="data.property.label.description">
      </localized-input>

      <div class="row-holder">
        <div class="label-holder">
          <label>
            <localize key="source.authority.authority.type"></localize>
          </label>
        </div>
        <div class="holder">
          <select id="authorityType" name="authorityType" class="select-area" [(ngModel)]="authority.authorityType"
            [disabled]="readOnly">
            <option></option>
            <option value="GOVERNMENT">
              <localize key="authority.type.government"></localize>
            </option>
            <option value="STATISTICAL">
              <localize key="authority.type.statistical"></localize>
            </option>
            <option value="MAPPING">
              <localize key="authority.type.mapping"></localize>
            </option>
            <option value="RESEARCH">
              <localize key="authority.type.research"></localize>
            </option>
            <option value="NGO">
              <localize key="authority.type.ngo"></localize>
            </option>
            <option value="PRIVATE">
              <localize key="authority.type.private"></localize>
            </option>
            <option value="STANDARDS">
              <localize key="authority.type.standards"></localize>
            </option>
            <option value="COMMUNITY">
              <localize key="authority.type.community"></localize>
            </option>
            <option value="INDIVIDUAL">
              <localize key="authority.type.individual"></localize>
            </option>
            <option value="CONSORTIUM">
              <localize key="authority.type.consortium"></localize>
            </option>
            <option value="PROGRAM">
              <localize key="authority.type.program"></localize>
            </option>
          </select>
        </div>
      </div>      

      <div class="row-holder">
        <div class="button-holder">
          <button type="button" class="btn btn-default" (click)="close()">
            <localize key="modal.button.cancel"></localize>
          </button>
          <button *ngIf="!readOnly" type="button" class="btn btn-primary" [disabled]="form.invalid" (click)="update()">
            <localize key="modal.button.submit"></localize>
          </button>
        </div>
      </div>
    </fieldset>
  </form>

</div>
