@if (type) {
  <div>
    <ngx-spinner
      [fullScreen]="false"
      [name]="CONSTANTS.OVERLAY"
      type="ball-clip-rotate-multiple"
      size="medium"
    ></ngx-spinner>
    <div class="row">
      <div class="col-md-12">
        <h3>{{ type.label.localizedValue }}</h3>
      </div>
    </div>
    @if (mode == MODE.ATTRIBUTES && postGeoObject != null) {
      <div>
        <!-- Attributes tab -->
        @if (hierarchies && postGeoObject) {
          <geoobject-shared-attribute-editor
            #attributeEditor
            [geoObjectType]="type"
            [postGeoObject]="postGeoObject"
            [isNew]="isNew"
            [isGeometryInlined]="false"
            [hierarchies]="hierarchies"
            [readOnly]="!isEdit"
            [requestedDate]="forDate"
            [datasetId]="datasetId"
            (stabilityPeriodsChange)="stabilityPeriodsChange.emit($event)"
          >
          </geoobject-shared-attribute-editor>
        }
        @if (isEdit && !isMaintainer) {
          <div class="form-group" style="z-index: 0">
            <label>
              <localize key="change.request.reason.label"></localize>
            </label>
            <textarea
              rows="4"
              cols="50"
              [(ngModel)]="reason"
              class="form-control"
              name="reason-input"
              required
            ></textarea>
          </div>
        }
        <div class="button-holder text-right" style="margin-bottom: 20px">
          @if (!readOnly && !isEdit) {
            <button
              type="submit"
              (click)="onEditAttributes()"
              class="btn btn-primary"
              style="width: 100%"
              role="button"
            >
              <localize key="changeovertime.manageVersions.button.label"></localize>
            </button>
          }
          @if (isEdit) {
            <button type="button" class="btn btn-default" (click)="onCancelInternal()">
              <localize key="modal.button.cancel"></localize>
            </button>
          }
          @if (isEdit) {
            <button type="submit" (click)="onSubmit()" class="btn btn-primary" role="button" [disabled]="!canSubmit()">
              <localize [key]="!isMaintainer ? 'change.request.page.title' : 'modal.button.submit'"></localize>
            </button>
          }
        </div>
      </div>
    }
  </div>
}
