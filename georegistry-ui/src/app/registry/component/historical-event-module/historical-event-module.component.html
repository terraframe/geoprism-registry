<page-container>
  <div class="row">
    <div class="col-md-12">
      <div>
        <div class="heading">
          <h2>
            @if (tab === 'HISTORICAL-EVENT') {
              <localize key="transition.event.events"></localize>
            }
            @if (tab === 'HISTORICAL-REPORT') {
              <localize key="historical.row.report"></localize>
            }
          </h2>
        </div>

        <div class="inner-col-content-wrapper" style="padding-top: 30px; margin-top: 10px">
          @if (!readOnly) {
            <div class="row">
              <div class="col-md-12">
                <div class="form-group button-row">
                  <a
                    [routerLink]=""
                    (click)="handleTab('HISTORICAL-EVENT')"
                    [ngClass]="tab === 'HISTORICAL-EVENT' ? 'cr-filter-link-active' : ''"
                    style="border-bottom: 1px solid"
                  >
                    <localize key="transition.event.events"></localize>
                  </a>
                  <a
                    [routerLink]=""
                    (click)="handleTab('HISTORICAL-REPORT')"
                    [ngClass]="tab === 'HISTORICAL-REPORT' ? 'cr-filter-link-active' : ''"
                    style="margin-left: 5px; border-bottom: 1px solid"
                  >
                    <localize key="historical.row.report"></localize>
                  </a>
                </div>
                <hr style="border-top: solid 3px #6ba542" />
              </div>
            </div>
          }
          <div class="row">
            <div class="col-md-12">
              @if (tab === 'HISTORICAL-EVENT') {
                <transition-event-table></transition-event-table>
              }
              @if (tab === 'HISTORICAL-REPORT') {
                <historical-report></historical-report>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</page-container>
